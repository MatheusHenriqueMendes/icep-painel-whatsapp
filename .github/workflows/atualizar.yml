name: Atualizar painel

on:
  # Gatilho principal: toda vez que o sistema de disparo publica o envios.json (a cada 15 min, das 8h às 18h em dias úteis)
  push:
    branches: [main]
    paths: ['envios.json']
  # Reserva: o agendamento do GitHub atrasa ou pula horários, por isso não é o gatilho principal
  schedule:
    # A cada 1 hora, todos os dias (no minuto 7 de cada hora, para fugir do pico do GitHub no minuto 0)
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar data.json
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: node scripts/atualizar.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza dados do painel ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push

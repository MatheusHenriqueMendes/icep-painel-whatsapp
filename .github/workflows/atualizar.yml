name: Atualizar painel

on:
  schedule:
    # Dias úteis às 07h00 e 18h15 (horário de Brasília = UTC-3)
    - cron: '0 10 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar data.json
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: node scripts/atualizar.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza dados do painel ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
